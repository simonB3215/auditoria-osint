name: Gitleaks (escaneo de secretos)

# Pipeline de CI nuevo (a.md, auditoría post-venta, Secundario B) — no
# existía ningún workflow en este repo antes de este archivo.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
